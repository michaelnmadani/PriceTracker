<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Alert Banner -->
  <div id="alert-banner" class="alert-banner hidden"></div>

  <header>
    <div class="header-content">
      <h1>Price Tracker</h1>
      <p id="last-updated" class="subtitle">Loading...</p>
    </div>
  </header>

  <main>
    <!-- Summary Cards -->
    <section id="summary" class="summary-cards">
      <div class="card">
        <span class="card-value" id="total-products">0</span>
        <span class="card-label">Products</span>
      </div>
      <div class="card">
        <span class="card-value" id="at-all-time-low">0</span>
        <span class="card-label">At All-Time Low</span>
      </div>
      <div class="card">
        <span class="card-value" id="active-alerts">0</span>
        <span class="card-label">Price Alerts</span>
      </div>
      <div class="card">
        <span class="card-value" id="unavailable-count">0</span>
        <span class="card-label">Unavailable</span>
      </div>
    </section>

    <!-- Filters -->
    <section class="filters">
      <input type="text" id="search-input" placeholder="Search products..." class="search-input">
      <select id="category-filter" class="filter-select">
        <option value="">All Categories</option>
      </select>
    </section>

    <!-- Product Table -->
    <section id="product-table-container">
      <div class="table-wrapper">
        <table id="product-table">
          <thead>
            <tr>
              <th data-sort="name">Name <span class="sort-icon"></span></th>
              <th data-sort="best_price">Best Price <span class="sort-icon"></span></th>
              <th data-sort="availability">Availability <span class="sort-icon"></span></th>
              <th data-sort="all_time_low">All-Time Low <span class="sort-icon"></span></th>
              <th data-sort="price_change">Change <span class="sort-icon"></span></th>
              <th data-sort="alert">Alert <span class="sort-icon"></span></th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="product-tbody">
          </tbody>
        </table>
      </div>
      <p id="empty-state" class="empty-state hidden">
        No products tracked yet. Click <strong>"+ Add Product"</strong> to get started.
      </p>
    </section>
  </main>

  <!-- Chart Modal -->
  <div id="chart-modal" class="modal hidden">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h2 id="chart-title">Price History</h2>
        <button class="modal-close" data-close-modal="chart-modal">&times;</button>
      </div>
      <div class="chart-controls">
        <button class="btn btn-sm active" data-range="30">30 Days</button>
        <button class="btn btn-sm" data-range="90">90 Days</button>
        <button class="btn btn-sm" data-range="365">1 Year</button>
        <button class="btn btn-sm" data-range="0">All Time</button>
      </div>
      <div class="chart-container">
        <canvas id="price-chart"></canvas>
      </div>
    </div>
  </div>


  <footer></footer>

  <script src="js/app.js"></script>
  <script src="js/table.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/alerts.js"></script>
</body>
</html>
