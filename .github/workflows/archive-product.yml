name: Archive Product

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  archive-product:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, '[Archive Product]') || startsWith(github.event.issue.title, '[Unarchive Product]')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/product-price-tracker-FwFd5

      - name: Archive or unarchive product
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = context.payload.issue.title;
            const isArchive = title.startsWith('[Archive Product]');
            const productId = title
              .replace('[Archive Product]', '')
              .replace('[Unarchive Product]', '')
              .trim();

            const path = 'data/products.json';
            const data = JSON.parse(fs.readFileSync(path, 'utf-8'));
            const product = data.products.find(p => p.id === productId);

            if (!product) {
              core.setFailed(`Product not found: ${productId}`);
              return;
            }

            product.archived = isArchive;
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
            fs.mkdirSync('docs/data', { recursive: true });
            fs.copyFileSync(path, 'docs/data/products.json');

            core.exportVariable('PRODUCT_NAME', product.name);
            core.exportVariable('ARCHIVE_ACTION', isArchive ? 'archived' : 'unarchived');
            console.log(`${isArchive ? 'Archived' : 'Unarchived'} product: ${product.name} (${productId})`);

      - name: Commit and push
        run: |
          git config user.name "Price Tracker Bot"
          git config user.email "bot@pricetracker.local"
          git add data/products.json docs/data/products.json
          git diff --staged --quiet || git commit -m "${ARCHIVE_ACTION} product: ${PRODUCT_NAME}"
          git push origin claude/product-price-tracker-FwFd5

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            const action = process.env.ARCHIVE_ACTION;
            const name = process.env.PRODUCT_NAME;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Product **${name}** has been **${action}**.\n\n${action === 'archived' ? 'It will no longer be scraped but price history is preserved. Unarchive at any time.' : 'It will resume being tracked on the next scrape run.'}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
