name: Add Product

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Product name'
        required: true
      urls_json:
        description: 'URLs as JSON array, e.g. [{"url":"https://...","label":"Store"}]'
        required: true
      category:
        description: 'Category (electronics, headphones, computers, home, gaming, appliances, other)'
        required: false
      target_price:
        description: 'Target price for alerts'
        required: false
      alert_enabled:
        description: 'Enable price alert (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  add-product:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/product-price-tracker-FwFd5

      - name: Add product to products.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'data/products.json';
            const data = JSON.parse(fs.readFileSync(path, 'utf-8'));

            const id = Math.random().toString(36).substring(2, 10);
            const product = {
              id,
              name: '${{ github.event.inputs.name }}',
              urls: JSON.parse('${{ github.event.inputs.urls_json }}'),
              added_date: new Date().toISOString().split('T')[0],
              active: true,
            };

            const category = '${{ github.event.inputs.category }}';
            if (category) product.category = category;

            const targetPrice = '${{ github.event.inputs.target_price }}';
            if (targetPrice) product.target_price = parseFloat(targetPrice);

            product.alert_enabled = '${{ github.event.inputs.alert_enabled }}' !== 'false';

            data.products.push(product);
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');

            // Also update docs copy
            fs.mkdirSync('docs/data', { recursive: true });
            fs.copyFileSync(path, 'docs/data/products.json');

            console.log(`Added product: ${product.name} (${id})`);

      - name: Commit and push
        run: |
          git config user.name "Price Tracker Bot"
          git config user.email "bot@pricetracker.local"
          git add data/products.json docs/data/products.json
          git diff --staged --quiet || git commit -m "Add tracked product: ${{ github.event.inputs.name }}"
          git push origin claude/product-price-tracker-FwFd5
