name: Add Product

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write        # ← add this line

jobs:
  add-product:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, '[Add Product]')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/product-price-tracker-FwFd5

      - name: Parse issue and add product
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body;

            // Extract JSON block from issue body
            const jsonMatch = body.match(/```json\n([\s\S]*?)\n```/);
            if (!jsonMatch) {
              core.setFailed('No JSON block found in issue body');
              return;
            }

            const product = JSON.parse(jsonMatch[1]);

            // Validate required fields
            if (!product.name || !product.urls || product.urls.length === 0) {
              core.setFailed('Product must have name and at least one URL');
              return;
            }

            // Ensure required fields
            if (!product.id) product.id = Math.random().toString(36).substring(2, 10);
            if (!product.added_date) product.added_date = new Date().toISOString().split('T')[0];
            if (product.active === undefined) product.active = true;

            // Add to products.json
            const path = 'data/products.json';
            const data = JSON.parse(fs.readFileSync(path, 'utf-8'));
            data.products.push(product);
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');

            // Copy to docs
            fs.mkdirSync('docs/data', { recursive: true });
            fs.copyFileSync(path, 'docs/data/products.json');

            core.exportVariable('PRODUCT_NAME', product.name);
            core.exportVariable('PRODUCT_ID', product.id);
            console.log(`Added product: ${product.name} (${product.id})`);

      - name: Commit and push
        run: |
          git config user.name "Price Tracker Bot"
          git config user.email "bot@pricetracker.local"
          git add data/products.json docs/data/products.json
          git diff --staged --quiet || git commit -m "Add tracked product: ${PRODUCT_NAME}"
          git push origin claude/product-price-tracker-FwFd5

      - name: Trigger price scrape
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'scrape.yml',
              ref: 'claude/product-price-tracker-FwFd5',
            });
            console.log('Triggered scrape workflow');

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Product **${process.env.PRODUCT_NAME}** has been added (ID: \`${process.env.PRODUCT_ID}\`).\n\nPrices will be populated on the next scrape run.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
