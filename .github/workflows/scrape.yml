name: Daily Price Scrape

on:
  schedule:
    - cron: '0 21 * * *'  # 8:00 AM AEST (UTC+11) / 7:00 AM AEST (UTC+10)
  workflow_dispatch:       # Allow manual triggering from GitHub UI
    inputs:
      product_id:
        description: 'Only scrape this product ID (leave blank for all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/product-price-tracker-FwFd5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scrape.py ${PRODUCT_ID:+--product-id "$PRODUCT_ID"}
        env:
          CULTS3D_USERNAME: ${{ secrets.CULTS3D_USERNAME }}
          CULTS3D_API_KEY: ${{ secrets.CULTS3D_API_KEY }}
          PRODUCT_ID: ${{ inputs.product_id }}

      - name: Copy data for frontend
        run: |
          mkdir -p docs/data
          cp data/products.json docs/data/products.json
          cp data/prices.json docs/data/prices.json

      - name: Commit and push updated prices
        run: |
          git config user.name "Price Tracker Bot"
          git config user.email "bot@pricetracker.local"
          git add data/prices.json docs/data/
          git diff --staged --quiet || git commit -m "Update prices $(date -u +%Y-%m-%d)"
          git push origin claude/product-price-tracker-FwFd5
